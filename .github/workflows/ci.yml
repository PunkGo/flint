name: CI

# Doc-only changes skip CI. examples/laws/*.md are NOT ignored — tests read them
# (sample-law lint guards in init.rs, include_str! in law_patterns).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'SETUP.md'
      - 'ARCHITECTURE.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - 'AUTHORITY.toml'
      - 'LICENSE'
      - 'docs/**'
      - 'assets/**'
      - 'examples/laws/README.md'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'SETUP.md'
      - 'ARCHITECTURE.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - 'AUTHORITY.toml'
      - 'LICENSE'
      - 'docs/**'
      - 'assets/**'
      - 'examples/laws/README.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
