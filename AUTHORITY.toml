# AUTHORITY.toml — pointer-level source of truth (authority-first convention).
# Stateless: binds which file answers for what; carries no project state itself.
# Every pointer must resolve from a fresh clone; machine-local state is declared, not pointed.

[authority]
architecture_file = "ARCHITECTURE.md"
setup_manual_file = "SETUP.md"
constitution_files = ["docs/whitepaper.md", "docs/PIP-0001-core-freeze.md"]
contributing_file = "CONTRIBUTING.md"
security_file = "SECURITY.md"
runbook_files = ["skills/flint-knowledge/SKILL.md", "skills/flint-status/SKILL.md"]

[recovery]
read_order = [
  "SETUP.md",
  "ARCHITECTURE.md",
  "docs/whitepaper.md",
  "docs/PIP-0001-core-freeze.md",
  "CONTRIBUTING.md",
]

[state]
kind = "machine-local"
note = "task state lives in per-machine harness memory — not pointed because it does not exist on a fresh clone. SETUP.md is the install-and-operate manual; the owner's private session wiring (CLAUDE.md) stays machine-local and gitignored."
